spring:
  application:
    name: user-module
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

product:
  base-url: ${PRODUCT_BASE_URL:http://localhost:8081}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  from-number: ${SOLAPI_FROM_NUMBER}

encryption:
  secret: ${ENCRYPTION_SECRET}
  salt: ${ENCRYPTION_SALT}

springdoc:
  swagger-ui:
    path: /api/user/swagger-ui/index.html
  api-docs:
    path: /api/user/v3/api-docs