spring:
  application:
    name: user-module
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

product:
  base-url: ${PRODUCT_BASE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /api/user/swagger-ui/index.html
  api-docs:
    path: /api/user/v3/api-docs