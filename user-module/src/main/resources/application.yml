spring:
  application:
    name: user-module
  datasource:
    url: jdbc:mysql://localhost:3306/sol
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  profiles:
    include: local

server:
  port: 8082
