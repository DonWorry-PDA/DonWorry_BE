spring:
  application:
    name: product-module
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /api/product/swagger-ui.html
  api-docs:
    path: /api/product/v3/api-docs