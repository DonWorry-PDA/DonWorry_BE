name: Deploy user-module

on:
  push:
    branches: [ develop ]
    paths:
      - 'user-module/**'
      - 'common-module/**'
      - 'gradle/**'
      - 'build.gradle'
      - '.github/workflows/deploy-user.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: donworry/user-module
  APP_NAME: donworry-user-module
  DEPLOY_GROUP: dg-user-module
  S3_BUCKET: donworry-codedeploy-artifacts

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew :user-module:bootJar --no-daemon

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -f user-module/Dockerfile user-module/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Create deploy.env
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          {
            printf "ECR_URI='%s'\n" "$ECR_REGISTRY"
            printf "IMAGE_TAG='%s'\n" "$IMAGE_TAG"
            printf "DB_URL='%s'\n" "$DB_URL"
            printf "DB_USER='%s'\n" "$DB_USER"
            printf "DB_PASSWORD='%s'\n" "$DB_PASSWORD"
            printf "JWT_SECRET='%s'\n" "$JWT_SECRET"
          } > user-module/scripts/deploy.env

      - name: Upload deployment bundle to S3
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd user-module
          zip -r "../deploy-user-$IMAGE_TAG.zip" appspec.yml scripts/
          cd ..
          aws s3 cp "deploy-user-$IMAGE_TAG.zip" \
            "s3://$S3_BUCKET/user-module/deploy-$IMAGE_TAG.zip"

      - name: Create CodeDeploy deployment
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$APP_NAME" \
            --deployment-group-name "$DEPLOY_GROUP" \
            --s3-location "bucket=$S3_BUCKET,key=user-module/deploy-$IMAGE_TAG.zip,bundleType=zip" \
            --description "Deploy $IMAGE_TAG" \
            --query 'deploymentId' \
            --output text)
          echo "Deployment ID: $DEPLOYMENT_ID"
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
